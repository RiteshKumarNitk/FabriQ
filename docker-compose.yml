services:
  postgres:
    image: postgres:16-alpine
    container_name: fabriq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fabriq
      POSTGRES_PASSWORD: fabriq
      POSTGRES_DB: fabriq
    ports:
      - "5432:5432"
    volumes:
      - fabriq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabriq -d fabriq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fabriq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - fabriq-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fabriq-postgres-data:
  fabriq-redis-data:
